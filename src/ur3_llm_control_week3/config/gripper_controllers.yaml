controller_manager:
  ros__parameters:
    update_rate: 250
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint,
             wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      shoulder_pan_joint: {goal: 0.015, trajectory: 0.15}
      shoulder_lift_joint: {goal: 0.015, trajectory: 0.15}
      elbow_joint: {goal: 0.015, trajectory: 0.15}
      wrist_1_joint: {goal: 0.015, trajectory: 0.15}
      wrist_2_joint: {goal: 0.015, trajectory: 0.15}
      wrist_3_joint: {goal: 0.015, trajectory: 0.15}

gripper_controller:
  ros__parameters:
    joints: [left_finger_joint, right_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      left_finger_joint: {goal: 0.004, trajectory: 0.03}
      right_finger_joint: {goal: 0.004, trajectory: 0.03}
